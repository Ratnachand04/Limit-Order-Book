# S2_GLFT -- the steady-state form (master plan §3.5).
#
#   delta_b*(q) = (1/gamma) ln(1 + gamma/k) + ((2q+1)/2) * sqrt(C)
#   delta_a*(q) = (1/gamma) ln(1 + gamma/k) - ((2q-1)/2) * sqrt(C)
#   C           = (sigma^2 gamma)/(2 k A) * (1 + gamma/k)^(1 + k/gamma)
#
# Guéant, Lehalle & Fernandez-Tapia (2013). These are the inventory-bounded
# asymptotic distances practitioners actually use, because they do not depend on
# a fictitious terminal time -- which is the weakest part of applying A-S to a
# 24/7 market.
#
# Sign check to keep in your head: at q = 0 the two distances are equal; at
# q = +1 the bid moves AWAY (buy less) and the ask moves CLOSER (sell more).
# The test suite asserts exactly that monotonicity.
#
# This mode needs A as well as k, so the calibration file matters more here than
# it does for plain A-S.

symbols: [BTCUSDT]
tick_size: {BTCUSDT: 0.01}
lot_size:  {BTCUSDT: 0.001}

latency_ms: {in: 50, out: 50, jitter_exp_ms: 5}
queue_model: PESS
fill_model: QUEUE
fees_bp: {maker: 2.0, taker: 5.0}

strategy:
  name: S2_GLFT
  order_size_lots: 1
  q_max: 5
  requote_min_ticks: 2
  timer_ms: 100
  quote_both_sides: true

  sigma_sample_s: 1
  sigma_window_s: 600

  gamma: 1.0e-5
  horizon_s: 60             # unused in GLFT mode; kept so configs stay comparable

  k_A_calibration: ""
  k_fallback: 0.035
  A_fallback: 1.0

  glft_mode: true
  tick_floor_at_touch: true
  enforce_min_edge: true

markouts:
  horizons_s: [0.1, 0.5, 1, 2, 5, 10, 30, 60]

probes: {enabled: false}

seed: 42
input_path: ""
output_dir: data/results/s2_glft
eval_window: {start: 2026-09-01, end: 2026-10-10}
